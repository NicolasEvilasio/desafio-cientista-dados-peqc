name: dbt

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read
  id-token: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT: ${{ vars.GCP_PROJECT }}
    steps:
      - uses: actions/checkout@v5

      - uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version: "3.13"

      - run: uv sync --frozen

      - run: uv run dbt deps --project-dir dbt --profiles-dir dbt

      - name: Manifest do master anterior
        id: state
        run: |
          set -euo pipefail
          mkdir -p dbt/ci-state
          echo "found=false" >> "$GITHUB_OUTPUT"
          run_id=$(gh run list \
            --workflow dbt.yml \
            --branch master \
            --event push \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')
          if [ -z "$run_id" ]; then
            echo "Nenhum build anterior de master. Build completo."
            exit 0
          fi
          if ! gh run download "$run_id" --name dbt-manifest --dir dbt/ci-state; then
            echo "Run $run_id sem manifest. Build completo."
            exit 0
          fi
          if [ -f dbt/ci-state/manifest.json ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: dbt build
        run: |
          set -euo pipefail
          if [ "${{ steps.state.outputs.found }}" = "true" ]; then
            uv run dbt build \
              --project-dir dbt \
              --profiles-dir dbt \
              --target ci \
              --select '+state:modified+' \
              --state ci-state
          else
            uv run dbt build --project-dir dbt --profiles-dir dbt --target ci
          fi

      - name: Guardar manifest
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && success()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-manifest
          path: dbt/target/manifest.json
          retention-days: 14
          if-no-files-found: error
